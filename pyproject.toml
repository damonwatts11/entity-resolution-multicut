[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ermc"
version = "0.0.0"
description = "Entity resolution at scale by certified decomposition of the minimum cost multicut problem"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniel Mon Watts" }]

# Runtime dependencies. Keep in sync with CLAUDE.md "No new dependency without asking".
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "rapidfuzz>=3.6",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Test / dev tooling. pytest-cov is required by spec.md 4.2 (>=90% line coverage).
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-cov>=5.0",
]
# The demonstration application (Level F only). Kept optional so the core env stays light.
app = [
    "streamlit>=1.33",
]

[tool.setuptools.packages.find]
include = ["ermc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ermc --cov-report=term-missing"
# NOTE: no --cov-fail-under yet. Add "--cov-fail-under=90" once the modules in
# kernels/persistency/solvers/bounds/metrics are implemented (spec.md 4.2).
